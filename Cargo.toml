[package]
name = "ideae"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.22"
gpui-cn = { version = "0.9.0", features = ["ghostty", "jetbrains-mono"] }
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages"] }
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lsp-types = { version = "0.97", features = ["proposed"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.26"
tree-sitter-batch = "0.11"
tree-sitter-containerfile = "0.9"
tree-sitter-groovy = "0.1"
tree-sitter-ini = "1.4"
tree-sitter-nginx = "1"
tree-sitter-powershell = "0.26"
tree-sitter-properties = "0.3"
tree-sitter-xml = "0.7"
tungstenite = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# GPUI and libghostty are unusably slow unoptimized; our own crate stays debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# window_border.rs patched: no 20px client-side shadow inset (see the file).
# diff/mod.rs patched: Diff::code_font_size, a per-view code size for zoom.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# terminal/core.rs + engine.rs patched: report light/dark (CSI ? 996 n, mode 2031).
gpui-cn = { path = "vendor/gpui-cn" }
# input/base/state.rs patched: hover/Ctrl+click hit-test ignored the scroll offset.
gpui-base = { path = "vendor/gpui-base" }

[profile.release]
strip = true
